
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#063d30">
  <title>وصال للسفر والسياحة</title>
  <meta name="description" content="عروض الطيران والسياحة والتأشيرات والخدمات التجارية من وصال. انضم إلى جروب واتساب.">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 18px 12px;
      background: #063d30;
      font-family: Arial, Tahoma, sans-serif;
      text-align: center;
    }

    .poster-link {
      display: block;
      max-width: 650px;
      margin: 0 auto;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 8px 28px #0005;
      line-height: 0;
    }

    .poster-link img {
      display: block;
      width: 100%;
      height: auto;
    }

    .join-button {
      display: block;
      max-width: 650px;
      margin: 18px auto 0;
      padding: 18px 12px;
      border-radius: 14px;
      background: #19bd5a;
      color: #fff;
      text-decoration: none;
      font-size: 21px;
      font-weight: bold;
      line-height: 1.5;
    }

    .hint {
      color: #fff;
      font-size: 14px;
      line-height: 1.8;
    }
  </style>
</head>
<body>

  <a class="poster-link"
     href="https://chat.whatsapp.com/Dw0rlUDyb2jEaHM8VQbumb"
     aria-label="انضم إلى جروب وصال على واتساب">
    <img src="poster.png"
         alt="وصال للسفر والسياحة: عروض الطيران والسياحة والتأشيرات والخدمات التجارية">
  </a>

  <a class="join-button"
     href="https://chat.whatsapp.com/Dw0rlUDyb2jEaHM8VQbumb">
    انضم إلى جروب واتساب الآن
  </a>

  <p class="hint">اضغط على الصورة أو الزر للانضمام إلى جروب وصال.</p>

</body>
</html>
